services:
  - type: web
    name: payfichain
    env: go
    plan: free

    envVars:
      - key: GO_VERSION
        value: 1.21.13

    buildCommand: |
      export CGO_ENABLED=0
      go mod tidy
      go build -tags netgo -o build/gaiad ./cmd/gaiad

    startCommand: |
      ./build/gaiad start --minimum-gas-prices=0.025stake